# A release for every push to main. main is the stable line; work lands on
# develop and reaches main by merging. scripts/version.mjs picks the version:
# a MAJOR or MINOR raised on develop (`pnpm version:bump minor`) ships as
# written, anything else raises the patch of the latest release. The version
# is committed to package.json on main (the build reads it from there), tagged
# vX.Y.Z and published as a GitHub Release with generated notes. develop is
# fast-forwarded to the release when it has nothing main lacks; otherwise it
# is left for a person to merge.
#
# The release is created as a draft, the desktop apps (desktop/) are built on
# macOS and Windows runners and attached to it under stable names, and it is
# then published: releases/latest/download/<name> always points at a complete
# release. A failed app build does not hold the release; the publish job
# warns, and re-running the failed job attaches the missing app. Beside each
# installer go the files the app's own updater reads (desktop/main.mjs): the
# update file for its architecture, latest-<arch>[-mac].yml, and on macOS the
# zip it installs from.
#
# The container image is built from the same tag for amd64 and arm64 and
# pushed to ghcr.io/kaperkunde/pcp as <version> and latest, which install.sh
# and docker-compose.yaml pull. It is independent of the apps in the same
# way: a failed image build does not hold the release, and latest stays at
# the previous release until the job is re-run.
#
# Pushes made with the workflow token start no workflows, so the release
# commit does not release itself again.

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: tag and draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      # The tip of main rather than the pushed commit: a run that waited
      # behind another must build on that one's release commit.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Pick the version
        id: version
        run: |
          if [ -n "$(git tag --points-at HEAD --list 'v*')" ]; then
            echo "main is already released as $(git tag --points-at HEAD --list 'v*')."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(node scripts/version.mjs next)"
          echo "Releasing v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Commit and tag
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/version.mjs set "$VERSION"
          if ! git diff --quiet -- package.json; then
            git commit -m "Release v$VERSION" -- package.json
          fi
          git tag -a "v$VERSION" -m "v$VERSION"
          git push --atomic origin HEAD:main "refs/tags/v$VERSION"
      - name: Fast-forward develop
        if: steps.version.outputs.skip != 'true'
        run: |
          git push origin HEAD:develop ||
            echo "::notice::develop has commits main lacks; merge main into develop by hand."
      - name: Draft the release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes --draft

  desktop:
    name: ${{ matrix.name }}
    needs: release
    if: needs.release.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS app (Apple silicon)
            os: macos-latest
            arch: arm64
            asset: PCP-mac-arm64.dmg
            updates: PCP-mac-arm64.zip latest-arm64-mac.yml
          - name: macOS app (Intel)
            os: macos-latest
            arch: x64
            asset: PCP-mac-x64.dmg
            updates: PCP-mac-x64.zip latest-x64-mac.yml
          - name: Windows app
            os: windows-latest
            arch: x64
            asset: PCP-windows-x64.exe
            updates: latest-x64.yml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        run: npm install -g --no-update-notifier pnpm@10.33.0
      - name: Install dependencies
        # Hoisted, so the standalone output holds files rather than pnpm's
        # symlinks, which an installer cannot carry (desktop/README.md).
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Build
        run: pnpm build
      - name: Install Electron and electron-builder
        run: pnpm install --frozen-lockfile
        working-directory: desktop
      - name: Package
        # Signed and notarized when the secrets exist, unsigned otherwise
        # (desktop/README.md, "Signing").
        run: pnpm dist --arch ${{ matrix.arch }}
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # The Developer ID provisioning profile that lets Touch ID keep its
          # key in a keychain item macOS opens only for a fingerprint.
          MAC_PROVISIONING_PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE }}
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
          ASSET: ${{ matrix.asset }}
          UPDATES: ${{ matrix.updates }}
        run: |
          ls -la desktop/dist
          gh release upload "v$VERSION" "desktop/dist/$ASSET" --clobber
          # Without these the app cannot update itself and sends the owner to
          # the download page instead, so a missing one warns, not fails.
          for file in $UPDATES; do
            if [ -f "desktop/dist/$file" ]; then
              gh release upload "v$VERSION" "desktop/dist/$file" --clobber
            else
              echo "::warning::desktop/dist/$file was not built; this app cannot install v$VERSION by itself."
            fi
          done

  image:
    name: container image
    needs: release
    if: needs.release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # The arm64 half runs under QEMU, and `next build` takes a while there.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # A plain manifest list: no attestation entries beside the images.
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: publish
    needs: [release, desktop, image]
    if: always() && needs.release.result == 'success' && needs.release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
          APPS: ${{ needs.desktop.result }}
          IMAGE: ${{ needs.image.result }}
        run: |
          if [ "$APPS" != "success" ]; then
            echo "::warning::A desktop app build did not succeed; v$VERSION is published without it. Re-run the failed job to attach it."
          fi
          if [ "$IMAGE" != "success" ]; then
            echo "::warning::The container image did not build; v$VERSION is published without it and ghcr.io/$GH_REPO:latest stays at the previous release. Re-run the failed job."
          fi
          gh release edit "v$VERSION" --draft=false
