# A release for every push to main. main is the stable line; work lands on
# develop and reaches main by merging. scripts/version.mjs picks the version:
# a MAJOR or MINOR raised on develop (`pnpm version:bump minor`) ships as
# written, anything else raises the patch of the latest release. The version
# is committed to package.json on main (the build reads it from there), tagged
# vX.Y.Z and published as a GitHub Release with generated notes. develop is
# fast-forwarded to the release when it has nothing main lacks; otherwise it
# is left for a person to merge.
#
# The release is created as a draft, the desktop apps (desktop/) are built on
# macOS and Windows runners and attached to it under stable names
# (build-desktop.yml), and it is then published: releases/latest/download/<name>
# always points at a complete release. A failed app build does not hold the
# release; the publish job warns, and re-running the failed job attaches the
# missing app.
#
# The container image is built from the same tag for amd64 and arm64 and
# pushed to ghcr.io/kaperkunde/pcp as <version> and latest, which install.sh
# and docker-compose.yaml pull, and run_code's sandbox beside it as
# ghcr.io/kaperkunde/pcp-sandbox, which docker-compose.sandbox.yaml pulls
# (build-images.yml). They are independent of the apps in the same way: a
# failed image build does not hold the release, and latest stays at the
# previous release until the job is re-run.
#
# develop.yml makes builds of develop the same way, as pre-releases tagged
# vX.Y.Z-dev.N. Those tags are not releases: this workflow looks only at
# vMAJOR.MINOR.PATCH, so a merge that fast-forwards main onto a build of
# develop is still released.
#
# Pushes made with the workflow token start no workflows, so the release
# commit does not release itself again, and the fast-forward of develop
# builds nothing there. The develop channel is offered the release all the
# same when it is later than every build of develop, so then the images
# move the develop tag as well as latest (scripts/version.mjs leads).

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: tag and draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
      develop: ${{ steps.develop.outputs.tag }}
    steps:
      # The tip of main rather than the pushed commit: a run that waited
      # behind another must build on that one's release commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Pick the version
        id: version
        run: |
          released="$(git tag --points-at HEAD --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          if [ -n "$released" ]; then
            echo "main is already released as $released."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(node scripts/version.mjs next)"
          echo "Releasing v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Commit and tag
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/version.mjs set "$VERSION"
          if ! git diff --quiet -- package.json; then
            git commit -m "Release v$VERSION" -- package.json
          fi
          git tag -a "v$VERSION" -m "v$VERSION"
          git push --atomic origin HEAD:main "refs/tags/v$VERSION"
      - name: Fast-forward develop
        if: steps.version.outputs.skip != 'true'
        run: |
          git push origin HEAD:develop ||
            echo "::notice::develop has commits main lacks; merge main into develop by hand."
      - name: Check develop's builds
        id: develop
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # The develop channel installs the image's develop tag, and PCP's
        # update check there offers the latest version among the releases and
        # develop's builds. A release later than every build is that version,
        # so the images move the develop tag too: the fast-forward of develop
        # builds nothing that would.
        run: |
          tag="$(node scripts/version.mjs leads "$VERSION")"
          echo "v$VERSION is later than every build of develop: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Draft the release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The notes start at the release before, not at a build of develop.
          previous="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "v$VERSION" | head -n 1 || true)"
          set -- --verify-tag --title "v$VERSION" --generate-notes --draft
          if [ -n "$previous" ]; then
            set -- "$@" --notes-start-tag "$previous"
          fi
          gh release create "v$VERSION" "$@"

  desktop:
    name: desktop apps
    needs: release
    if: needs.release.outputs.skip != 'true'
    uses: ./.github/workflows/build-desktop.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
    permissions:
      contents: write

  image:
    name: container images
    needs: release
    if: needs.release.outputs.skip != 'true'
    uses: ./.github/workflows/build-images.yml
    with:
      version: ${{ needs.release.outputs.version }}
      channel-tag: latest
      develop-tag: ${{ needs.release.outputs.develop == 'true' }}
    permissions:
      contents: read
      packages: write

  publish:
    name: publish
    needs: [release, desktop, image]
    if: always() && needs.release.result == 'success' && needs.release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
          APPS: ${{ needs.desktop.result }}
          IMAGE: ${{ needs.image.result }}
        run: |
          if [ "$APPS" != "success" ]; then
            echo "::warning::A desktop app build did not succeed; v$VERSION is published without it. Re-run the failed job to attach it."
          fi
          if [ "$IMAGE" != "success" ]; then
            echo "::warning::The container images did not build; v$VERSION is published without them and ghcr.io/$GH_REPO:latest (or ghcr.io/$GH_REPO-sandbox:latest) stays at the previous release. Re-run the failed job."
          fi
          gh release edit "v$VERSION" --draft=false
