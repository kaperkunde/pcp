# The container image for one tagged version, for amd64 and arm64, pushed to
# ghcr.io/kaperkunde/pcp as <version> and the channel's tag, and run_code's
# sandbox beside it as ghcr.io/kaperkunde/pcp-sandbox the same way. The
# channel's tag is `latest` for a release from main (release.yml), which
# install.sh and docker-compose.yaml pull, and `develop` for a build of
# develop (develop.yml), which they pull with PCP_CHANNEL=develop and
# PCP_TAG=develop. A release later than every build of develop moves
# `develop` too (release.yml's develop-tag): the develop channel is offered
# that release, so its tag has to carry it.
#
# The version is written into the checkout's package.json before the build,
# as build-desktop.yml does: the image reads it from there.
#
# Each image's digest (the manifest list's, for both platforms) is signed
# with cosign, keyless: the certificate is Sigstore's, issued for this
# workflow's GitHub OIDC token, so it names this file and the branch it ran
# from (refs/heads/main for a release, refs/heads/develop for a build), and
# the signature is in Sigstore's public log. --recursive signs each
# platform's manifest too, so a host that knows the image by either digest
# can check it. install.sh checks it before it runs an image or reads its
# installer (`cosign verify --certificate-identity-regexp
# '^https://github\.com/kaperkunde/pcp/\.github/workflows/build-images\.yml@refs/heads/(main|develop)$'
# --certificate-oidc-issuer https://token.actions.githubusercontent.com`).
# GitHub's own build provenance is attested for the same digests and pushed
# beside them (`gh attestation verify oci://… --repo kaperkunde/pcp`). Both
# go to the registry as artifacts of their own that name the image, so the
# build itself keeps `provenance: false` and stays a plain manifest list.
# The digests are the workflow's outputs, which the callers write into the
# release notes.

name: build container images

on:
  workflow_call:
    inputs:
      version:
        description: MAJOR.MINOR.PATCH, or MAJOR.MINOR.PATCH-dev.N; tagged vVERSION.
        required: true
        type: string
      channel-tag:
        description: The moving tag beside the version, latest or develop.
        required: true
        type: string
      develop-tag:
        description: >-
          Also move the develop tag: a release later than every build of
          develop, which the develop channel is offered as well.
        required: false
        type: boolean
        default: false
    outputs:
      digest:
        description: The digest of ghcr.io/<repository>, sha256:….
        value: ${{ jobs.image.outputs.digest }}
      sandbox-digest:
        description: The digest of ghcr.io/<repository>-sandbox, sha256:….
        value: ${{ jobs.image.outputs.sandbox-digest }}

# id-token: the OIDC token cosign and the attestation are signed with.
# attestations: GitHub's attestation store.
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  image:
    name: container image
    runs-on: ubuntu-latest
    # The arm64 half runs under QEMU, and `next build` takes a while there.
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.pcp.outputs.digest }}
      sandbox-digest: ${{ steps.sandbox.outputs.digest }}
    steps:
      - name: Check the tag
        env:
          CHANNEL_TAG: ${{ inputs.channel-tag }}
          DEVELOP_TAG: ${{ inputs.develop-tag }}
        run: |
          case "$CHANNEL_TAG" in
            latest | develop) ;;
            *) echo "::error::Not a channel's tag: $CHANNEL_TAG"; exit 1 ;;
          esac
          if [ "$DEVELOP_TAG" = true ] && [ "$CHANNEL_TAG" != latest ]; then
            echo "::error::Only a release moves the develop tag beside its own."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - name: Set the version
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/version.mjs set "$VERSION"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: pcp
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # A plain manifest list: no attestation entries beside the images.
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.version }}
            ghcr.io/${{ github.repository }}:${{ inputs.channel-tag }}
            ${{ inputs.develop-tag && format('ghcr.io/{0}:develop', github.repository) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # run_code's sandbox (sandbox/, docker-compose.sandbox.yaml), versioned
      # with PCP: the runner and PCP speak one protocol.
      - name: Build and push the sandbox
        id: sandbox
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: sandbox
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}-sandbox:${{ inputs.version }}
            ghcr.io/${{ github.repository }}-sandbox:${{ inputs.channel-tag }}
            ${{ inputs.develop-tag && format('ghcr.io/{0}-sandbox:develop', github.repository) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign the images
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.pcp.outputs.digest }}
          SANDBOX_DIGEST: ${{ steps.sandbox.outputs.digest }}
        run: |
          for ref in "$IMAGE@$DIGEST" "$IMAGE-sandbox@$SANDBOX_DIGEST"; do
            if ! [[ "$ref" =~ @sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Not an image digest: $ref"
              exit 1
            fi
            cosign sign --yes --recursive "$ref"
          done
      - name: Attest the image's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.pcp.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest the sandbox's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}-sandbox
          subject-digest: ${{ steps.sandbox.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
