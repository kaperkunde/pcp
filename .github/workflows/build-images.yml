# The container image for one tagged version, for amd64 and arm64, pushed to
# ghcr.io/kaperkunde/pcp as <version> and the channel's tag, and run_code's
# sandbox beside it as ghcr.io/kaperkunde/pcp-sandbox the same way. The
# channel's tag is `latest` for a release from main (release.yml), which
# install.sh and docker-compose.yaml pull, and `develop` for a build of
# develop (develop.yml), which they pull with PCP_CHANNEL=develop and
# PCP_TAG=develop.
#
# The version is written into the checkout's package.json before the build,
# as build-desktop.yml does: the image reads it from there.

name: build container images

on:
  workflow_call:
    inputs:
      version:
        description: MAJOR.MINOR.PATCH, or MAJOR.MINOR.PATCH-dev.N; tagged vVERSION.
        required: true
        type: string
      channel-tag:
        description: The moving tag beside the version, latest or develop.
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: container image
    runs-on: ubuntu-latest
    # The arm64 half runs under QEMU, and `next build` takes a while there.
    timeout-minutes: 60
    steps:
      - name: Check the tag
        env:
          CHANNEL_TAG: ${{ inputs.channel-tag }}
        run: |
          case "$CHANNEL_TAG" in
            latest | develop) ;;
            *) echo "::error::Not a channel's tag: $CHANNEL_TAG"; exit 1 ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - name: Set the version
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/version.mjs set "$VERSION"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # A plain manifest list: no attestation entries beside the images.
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.version }}
            ghcr.io/${{ github.repository }}:${{ inputs.channel-tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # run_code's sandbox (sandbox/, docker-compose.sandbox.yaml), versioned
      # with PCP: the runner and PCP speak one protocol.
      - name: Build and push the sandbox
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: sandbox
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}-sandbox:${{ inputs.version }}
            ghcr.io/${{ github.repository }}-sandbox:${{ inputs.channel-tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox
