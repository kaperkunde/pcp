# Checks on pull requests, and on every push to develop before it is built
# (develop.yml calls this workflow). Other pushes run nothing: the
# pre-commit hook covers lint, formatting and types locally, and a pull
# request is where the result is looked at. The jobs are independent and run
# side by side.

name: ci

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, format, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        run: npm install -g --no-update-notifier pnpm@10.33.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Shellcheck
        # The runner image ships shellcheck; install.sh is POSIX sh.
        run: shellcheck --shell=sh install.sh
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        run: npm install -g --no-update-notifier pnpm@10.33.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Install Chromium
        # The browser's tests (lib/core/browser/) drive a real one; without
        # it they are skipped.
        run: pnpm exec playwright install --with-deps chromium
      - name: Test
        run: pnpm test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        run: npm install -g --no-update-notifier pnpm@10.33.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Restore the build's cache
        # Next keeps what it compiled in .next/cache, and the next build
        # compiles again only what changed. Keyed on the dependencies and
        # the app's code; an older cache of the same dependencies still helps.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .next/cache
          key: next-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            next-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Run the suite
        # Builds the app for the suite (PCP_TEST_BUILD=1, so it may be
        # pointed at the fake GitHub; the checks job builds the release
        # one), then serves it as the image does (e2e/scripts/serve.mjs).
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            e2e/.artifacts/report
            e2e/.artifacts/test-results
          retention-days: 14
          if-no-files-found: ignore

  keychain:
    # The Touch ID keychain module (desktop/native/keychain) compiles only
    # on macOS. Releases build it again, for the app (release.yml).
    name: Touch ID keychain module
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        run: npm install -g --no-update-notifier pnpm@10.33.0
      - name: Install node-gyp
        run: pnpm install --frozen-lockfile
        env:
          # Compiling a Node-API module needs no Electron binary.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Build for Intel
        run: node scripts/keychain.mjs --arch x64
      - name: Build for Apple silicon, load it and ask it
        # The runner is Apple silicon, and its Node has no keychain
        # entitlement: the module must load and answer, and store nothing.
        run: node scripts/keychain.mjs --arch arm64 --check
