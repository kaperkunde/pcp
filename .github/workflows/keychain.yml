# The Touch ID keychain module (desktop/native/keychain) compiles only on
# macOS, so it has a runner of its own, on pull requests that change it or
# what builds it. Releases build it again, for the app (release.yml).

name: keychain

on:
  pull_request:
    paths:
      - desktop/native/**
      - desktop/scripts/keychain.mjs
      - desktop/package.json
      - desktop/pnpm-lock.yaml
      - .github/workflows/keychain.yml
  workflow_dispatch:

concurrency:
  group: keychain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Touch ID keychain module
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        run: npm install -g --no-update-notifier pnpm@10.33.0
      - name: Install node-gyp
        run: pnpm install --frozen-lockfile
        env:
          # Compiling a Node-API module needs no Electron binary.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Build for Intel
        run: node scripts/keychain.mjs --arch x64
      - name: Build for Apple silicon, load it and ask it
        # The runner is Apple silicon, and its Node has no keychain
        # entitlement: the module must load and answer, and store nothing.
        run: node scripts/keychain.mjs --arch arm64 --check
