pcp_format: 3
version: 1
name: Text Embeddings Inference
description: "Hugging Face Text Embeddings Inference: turns text into embeddings with a small open model, on CPU, behind an OpenAI-compatible /v1/embeddings. PCP adds its API as an endpoint, sending its key for you, and can use it as the embeddings provider for search (Settings → Search)."
image: ghcr.io/huggingface/text-embeddings-inference@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
source: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
ports:
  - container: 80
env:
  - name: API_KEY
    description: The key every request must send as a bearer token. PCP sends it for you; choose or type a long random secret.
    required: true
  - name: MODEL_ID
    description: The embedding model, as Hugging Face names it. The default is small and fast on CPU; BAAI/bge-base-en-v1.5 or a multilingual one (intfloat/multilingual-e5-small) also work.
    plain: true
    value: BAAI/bge-small-en-v1.5
volumes:
  - name: models
    path: /data
health:
  kind: http
  port: 80
  path: /health
registers:
  kind: openapi
  port: 80
  specPath: /api-doc/openapi.json
  auth:
    env: API_KEY
    header: Authorization
    template: Bearer {{secret}}
