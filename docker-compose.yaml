# Runs PCP on port 3000 with its data in a named volume. No environment
# variables are needed: open http://localhost:3000 and set up the owner.
#
#   docker compose up -d
#
# For anything beyond a LAN, PCP needs HTTPS: the session cookie is only
# marked Secure over https, and OAuth servers generally require https
# redirect URLs. Either turn on HTTPS under Settings and start PCP with the
# ports for it:
#
#   docker compose -f docker-compose.yaml -f docker-compose.https.yaml up -d
#
# or put a TLS-terminating proxy of your own in front of port 3000 (Caddy,
# Traefik, nginx, Coolify) and leave PCP's HTTPS off. If PCP guesses its
# public address wrong behind the proxy, pin it under Settings.
# docs/self-hosting.md walks through both.
services:
  pcp:
    # The published image, which install.sh runs without a checkout. With
    # both lines, `docker compose up -d` builds from this checkout when the
    # image is not on this computer yet and gives the build this name, and
    # `docker compose pull` fetches the published one instead.
    image: ghcr.io/kaperkunde/pcp:latest
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - pcp-data:/data
    # Optional. The time zone and language of the browser PCP runs follow the
    # container's, which has neither and so shows sites UTC and en-US, however
    # far from that you are. install.sh passes the host's on; here, set yours
    # (the zone as in /usr/share/zoneinfo, the language as in `echo $LANG`):
    # environment:
    #   TZ: Europe/Berlin
    #   LANG: de_DE.UTF-8

volumes:
  pcp-data:
